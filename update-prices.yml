name: Kurse aktualisieren

on:
  schedule:
    # Mo-Fr 22:30 UTC, nach US-Handelsschluss (Sommer- und Winterzeit)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: yfinance installieren
        run: pip install yfinance
      - name: Kurse laden
        run: python3 scripts/fetch_prices.py
      - name: Paper-Trading auswerten
        run: python3 scripts/paper_trading.py
      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data paper
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "Kurse aktualisiert"
            git push
          fi
