name: Watchlist Daten

on:
  workflow_dispatch: {}
  schedule:
    # Mo-Fr 23:00 UTC, nach dem Kursabruf
    - cron: "0 23 * * 1-5"

permissions:
  contents: write

jobs:
  watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: pip install yfinance
      - name: Watchlist laden
        run: python3 scripts/watchlist.py
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "Watchlist aktualisiert"
            git push
          fi
